  <style>
    /* Mirrors the values in assets/css/tokens.css */
    :root{
      --color-bg: #0c0b10;
      --color-surface: #14131b;
      --color-border-strong: #3d3950;
      --color-text: #ebe8f4;
      --color-text-muted: #a5a0b8;
      --color-text-subtle: #8a85a0;
      --color-accent: #a78bfa;
      --color-accent-strong: #c4b5fd;
      --color-accent-dim: #6d4fd8;
      --color-accent-ink: #0c0b10;
      --font-sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      --font-mono: "Cascadia Code", "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
      --pixel: 4px;
    }

    *, *::before, *::after{ box-sizing: border-box; }

    body{
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem 1rem;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.65;
      text-align: center;
    }

    main{
      display: grid;
      justify-items: center;
      gap: 1rem;
      max-width: 32rem;
    }

    .code{
      margin: 0;
      font-family: var(--font-mono);
      font-size: clamp(4rem, 3rem + 8vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: var(--color-accent);
      text-shadow: var(--pixel) var(--pixel) 0 var(--color-accent-dim);
    }

    .label{
      margin: 0;
      font-family: var(--font-mono);
      font-size: 0.875rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-text-subtle);
    }

    h1{
      margin: 0.5rem 0 0;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    p{
      margin: 0;
      color: var(--color-text-muted);
    }

    .button{
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      margin-top: 1rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid var(--color-accent);
      border-radius: 4px;
      background: var(--color-accent);
      color: var(--color-accent-ink);
      font-weight: 700;
      text-decoration: none;
      transition: transform 120ms steps(2, end), box-shadow 120ms steps(2, end);
    }

    .button:hover{
      background: var(--color-accent-strong);
      transform: translate(-2px, -2px);
      box-shadow: var(--pixel) var(--pixel) 0 0 var(--color-accent-dim);
    }

    .button:active{
      transform: none;
      box-shadow: none;
    }

    :focus{ outline: none; }

    :focus-visible{
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
    }

    .cursor{
      display: inline-block;
      width: 0.5em;
      height: 1em;
      margin-left: 0.15em;
      background: var(--color-accent);
      vertical-align: -0.15em;
      animation: blink 1.1s steps(1, end) infinite;
    }

    @keyframes blink{
      50%{ opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce){
      .cursor{ animation: none; }
      .button{ transition: none; }
    }
  </style>
</head>

  <main>
    <p class="code" aria-hidden="true">404</p>
    <p class="label">Level not found</p>
    <h1>This page wandered off the map<span class="cursor" aria-hidden="true"></span></h1>
    <p>The link might be old or mistyped. Let's get you back to the start.</p>
    <!-- href="/" works on the custom domain; the script below fixes it for the github.io project URL -->
    <a class="button" href="/" data-home>Respawn at home</a>
  </main>

  <script>
    (function(){
      // On https://remustrapsa.github.io/my_portfolio/... the site lives under /my_portfolio/
      const link = document.querySelector("[data-home]");
      if(location.hostname.endsWith("github.io")){
        const firstSegment = location.pathname.split("/")[1];
        link.href = "/" + (firstSegment ? firstSegment + "/" : "");
      }
    })();
  </script>
</body>
